name: smoke-ci
on: pull_request
permissions:
  contents: read
jobs:
  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No TODO-SMOKE markers
        run: |
          hits=$(grep -rn "TODO-SMOKE" src || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::TODO-SMOKE marker must be removed before merge"
            done
            exit 1
          fi
